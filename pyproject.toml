[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ezsnake"]

[project]
name = "ezsnake"
version = "0.3.11"

description = """ 
Paquete Python para manipulación sencilla de Word, datos y NetCDF. 
Python package for easy handling of Word, data, and NetCDF files.
Doc: https://github.com/Fernandojbf123/ezsnake
"""

readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "netcdf4>=1.7.4",
    "numpy>=2.0",
    "openpyxl>=3.1",
    "pandas>=2.0",
    "python-docx>=1.1",
    "scipy>=1.17.1",
]

authors = [
    { name = "Fernando Bello Fuentes (BelloDev)", email = "fernandojbf123@gmail.com" },
]

[dependency-groups]
dev = [
    "pytest>=9.0",
]
